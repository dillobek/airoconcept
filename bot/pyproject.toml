[project]
name = "airoconcept-bot"
version = "0.1.0"
description = "AiroConcept — mijozlar uchun Telegram bot (backend agentiga ulanadi)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
