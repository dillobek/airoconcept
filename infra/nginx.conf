# Reverse proxy namunasi (HTTPS sertifikatlari: certbot / Let's Encrypt).
# AIRO production: web.airoconcept.uz (mijozlar), my.airoconcept.uz (CRM), api.airoconcept.uz (API).

limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_all:10m rate=20r/s;

server {
    listen 80;
    server_name web.airoconcept.uz my.airoconcept.uz api.airoconcept.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.airoconcept.uz;
    ssl_certificate     /etc/letsencrypt/live/airoconcept.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airoconcept.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    server_tokens off;

    # Ichki marshrutlar (Telegram bot) tashqaridan YOPIQ — bot API'ga ichki tarmoq orqali ulanadi
    location /internal/ { return 404; }

    location /auth/otp/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
    }

    # To'lov webhooklari: faqat Payme va Click IP manzillaridan ruxsat bering (ular bergan ro'yxat bo'yicha)
    # location /payments/payme { allow <PAYME_IP>; deny all; proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy_params; }
    # location /payments/click { allow <CLICK_IP>; deny all; proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy_params; }

    location / {
        limit_req zone=api_all burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl http2;
    server_name web.airoconcept.uz;
    ssl_certificate     /etc/letsencrypt/live/airoconcept.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airoconcept.uz/privkey.pem;
    server_tokens off;
    location / { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
}

server {
    listen 443 ssl http2;
    server_name my.airoconcept.uz;
    ssl_certificate     /etc/letsencrypt/live/airoconcept.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airoconcept.uz/privkey.pem;
    server_tokens off;
    # CRM'ni faqat ofis IP manzillaridan ochish tavsiya etiladi:
    # allow <OFIS_IP>; deny all;
    location / { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
}
