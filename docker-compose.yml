# Ishlab chiqish va kichik ishlab chiqarish muhiti uchun.
# Ma'lumotlar bazasi, Redis va MinIO portlari faqat 127.0.0.1 ga ochiladi —
# tashqi dunyoga faqat reverse proxy (nginx/caddy, HTTPS) orqali api/web/admin chiqadi.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  minio:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    # SeaweedFS S3 server. MinIO's public image registry was discontinued;
    # the service name stays "minio" so existing S3 endpoint configuration remains stable.
    command: server -s3 -dir=/data
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:8333:8333"

  plan-service:
    build: ./services/plan-recognition
    restart: unless-stopped
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: https://api.airoconcept.uz/_s3
      PLAN_SERVICE_URL: http://plan-service:8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports:
      - "127.0.0.1:4400:4000"
    security_opt: ["no-new-privileges:true"]

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_API_URL: http://api:4000
    depends_on: [api]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}
        NEXT_PUBLIC_FILES_URL: ${S3_PUBLIC_URL}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:4401:3000"
    security_opt: ["no-new-privileges:true"]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}
        NEXT_PUBLIC_FILES_URL: ${S3_PUBLIC_URL}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:4402:3001"
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  redisdata:
  miniodata:
